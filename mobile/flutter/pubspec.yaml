name: real_time_conversation_translator
description: A revolutionary real-time conversation translator mobile app.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & State Management
  provider: ^6.0.0
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Networking
  http: ^1.1.0
  socket_io_client: ^2.0.1
  dio: ^5.1.2

  # Audio & Speech
  speech_to_text: ^6.1.1
  flutter_tts: ^9.2.3
  just_audio: ^0.9.30
  record: ^4.4.4
  audio_session: ^0.1.16

  # Storage
  sqflite: ^2.2.8+4
  path_provider: ^2.0.14
  shared_preferences: ^2.0.18
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # QR Code
  qr_code_scanner: ^1.0.1
  qr_flutter: ^4.0.0

  # UI Components
  cupertino_icons: ^1.0.2
  material_design_icons_flutter: ^7.0.7296
  flutter_slidable: ^3.0.0
  intl: ^0.18.1

  # Utilities
  uuid: ^3.0.7
  logger: ^2.0.1
  get_it: ^7.5.0
  dartz: ^0.10.1
  internet_connection_checker: ^1.0.0+1

  # Image handling
  image_picker: ^0.8.8
  cached_network_image: ^3.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.1
  mockito: ^5.4.0
  build_runner: ^2.3.3
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
